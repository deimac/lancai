# Coolify / Nixpacks: monorepo LançAI — sobe só a API.
# No painel Coolify, deixe "Build Command" vazio (usa este arquivo) ou
# `pnpm build:api`. Não use `pnpm build:all` / Vite neste serviço.

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm build:api"]

[start]
cmd = "pnpm start:api"
